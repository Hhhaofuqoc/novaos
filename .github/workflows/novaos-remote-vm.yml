name: NovaOS Full Remote VM (browser)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duração da sessão remota (minutos)'
        required: true
        default: '60'
        type: choice
        options:
          - '30'
          - '60'
          - '90'
  workflow_run:
    workflows:
      - 'NovaOS Full ISO (amd64)'
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: novaos-browser-vm-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  remote:
    name: Boot NovaOS Full and open protected noVNC
    # The auto-run only applies to the completed ISO with the LightDM login fix.
    # Older successful ISOs must not open a remote session automatically.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_sha == '4d9c026dea73e22b00b8d654060111d67e140780') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Check out NovaOS
        uses: actions/checkout@v4

      - name: Validate private access password
        env:
          NOVAOS_REMOTE_PASSWORD: ${{ secrets.NOVAOS_REMOTE_PASSWORD }}
        shell: bash
        run: |
          if [[ ${#NOVAOS_REMOTE_PASSWORD} -lt 16 ]]; then
            echo '::error::Set repository Actions secret NOVAOS_REMOTE_PASSWORD with at least 16 characters before starting.'
            exit 1
          fi

      - name: Download latest successfully built NovaOS Full ISO
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_ISO_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "$AUTO_ISO_RUN_ID" ]]; then
            RUN_ID="$AUTO_ISO_RUN_ID"
          else
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow novaos-full-iso.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          echo "Using verified ISO workflow run: $RUN_ID"
          if [[ -z "$RUN_ID" ]]; then
            echo '::error::No successful NovaOS Full ISO build found. Complete the NovaOS Full ISO (amd64) workflow first.'
            exit 1
          fi
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name NovaOS-v1.0-Full-amd64 --dir dist
          cd dist
          sha256sum -c SHA256SUMS.txt
          test -s NovaOS-v1.0-Full-amd64.iso
          file NovaOS-v1.0-Full-amd64.iso
          ls -lh NovaOS-v1.0-Full-amd64.iso

      - name: Install QEMU, noVNC, Nginx and tunnel client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 novnc websockify nginx apache2-utils curl ca-certificates
          curl --fail --location --retry 3 \
            'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64' \
            -o "$RUNNER_TEMP/cloudflared"
          sudo install -m 0755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start temporary authenticated browser desktop
        env:
          NOVAOS_REMOTE_PASSWORD: ${{ secrets.NOVAOS_REMOTE_PASSWORD }}
          NOVAOS_SESSION_MINUTES: ${{ inputs.session_minutes || '60' }}
        shell: bash
        run: bash iso/full/remote-vm.sh "$NOVAOS_SESSION_MINUTES"

-- NovaOS real system widget. Off by default; opt in on Desktop only.
conky.config = {
  alignment = 'top_right', gap_x = 24, gap_y = 76,
  background = false, update_interval = 3, double_buffer = true,
  own_window = true, own_window_type = 'desktop',
  own_window_argb_visual = true, own_window_argb_value = 190,
  own_window_colour = '08040F', own_window_transparent = false,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  use_xft = true, font = 'DejaVu Sans:size=10',
  default_color = 'EDE6FF', color1 = '00DFFF', color2 = 'A020F0',
  minimum_width = 240, maximum_width = 280, border_inner_margin = 18,
  draw_shades = false, draw_outline = false, draw_borders = false,
  cpu_avg_samples = 3, net_avg_samples = 3, no_buffers = true,
};
conky.text = [[
${font DejaVu Sans:bold:size=15}${color1}NOVA${color} / SYSTEM${font}
${color2}${hr 1}${color}
CPU ${alignr}${cpu}%
${color1}${cpubar 5}${color}
RAM ${alignr}${mem} / ${memmax}
${color2}${membar 5}${color}
Storage ${alignr}${fs_used /} / ${fs_size /}
${fs_bar 5 /}

Uptime ${alignr}${uptime_short}
Kernel ${alignr}${kernel}
Architecture ${alignr}${machine}
${color2}${hr 1}${color}
Your universe. Your system.
]];
